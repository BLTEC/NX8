[values]
; Registra temperatura no log a cada N ms (0 = desativado)
temp_log_interval_ms=5000
; Escreve no CSV a cada N ms (0 = desativado) -- ative se quiser
; analisar clocks/temperatura depois, ex. num grafico
csv_write_interval_ms=0

; -----------------------------------------------------------------
; O sys-clk NAO tem um perfil "global" que valha pra todo jogo --
; só da pra configurar por Title ID (uma secao [TITLEID] por jogo),
; e o proprio sys-clk nao adiciona protecao termica/de tensao alem
; da que ja existe no proprio chip -- o overclock so eh limitado
; pelo valor maximo que voce configurar aqui, entao NAO coloquei
; nenhum valor "elevado" chutado sem testar em jogo nenhum: um clock
; que e seguro pra um jogo pode travar outro, e isso so se descobre
; testando.
;
; Como configurar overclock com seguranca (recomendado):
;  1. Abra o overlay do sys-clk (segure o combo do Ultrahand) dentro
;     do jogo que quiser testar.
;  2. Ative "Overclock" e va subindo os valores aos poucos, jogando
;     um pouco em cada nivel -- se travar/reiniciar, você passou do
;     limite seguro PRA AQUELE jogo/console especifico.
;  3. Quando achar um valor estavel, salve como perfil daquele jogo
;     (o sys-clk grava automaticamente uma secao [TITLEID] aqui).
;
; Referencia dos clocks OFICIAIS de fabrica (documentados pelo
; proprio sys-clk), pra você ter noção de quanto cada valor testado
; esta acima do padrao:
;   CPU:  1020 MHz (docked e handheld, oficial)
;   GPU:   768 MHz docked oficial | 460 MHz handheld oficial
;          (768/614 MHz em unidades Mariko/OLED)
;   MEM:  1600 MHz docked oficial (boost) | 1331 MHz handheld oficial
;
; Exemplo (comentado) do formato de uma secao por jogo:
;[01007EF00011E000]
;docked_cpu=1224
;handheld_mem=1600
