[config]
autoboot=0
autoboot_list=0
bootwait=3
noticker=0
backlight=100
autohosoff=1
autonogc=1
updater2p=1
bootprotect=0



{-- CFW (emuMMC) --}
[Atmosphere (emuMMC)]
fss0=atmosphere/package3
icon=bootloader/res/icon_switch.bmp
emummcforce=1

# Boots Atmosphere sempre contra a emuNAND. Se a emuMMC nao estiver
# configurada (emummc.ini ausente/desativada), o boot falha com erro
# em vez de cair na sysNAND por engano.



{-- Sistema original (sysNAND, sem CFW) --}
[Sistema Original (Stock)]
pkg3=atmosphere/package3
stock=1
emummc_force_disable=1
icon=bootloader/res/icon_switch.bmp

# stock=1 desliga o patch de kernel e os kips do CFW. E' o mais proximo
# possivel do firmware oficial (OFW) rodando na NAND real do console --
# use esta entrada pra jogar online / eShop / atualizar via Nintendo.



# hekate_ipl.ini gerado a partir do template oficial
# (C:\hekate\res\hekate_ipl_template.ini, CTCaer hekate v6.5.3).
